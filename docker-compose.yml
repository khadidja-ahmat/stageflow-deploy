services:
  # ---------- L'application (démarre toujours) ----------
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo}
      MYSQL_DATABASE: stageflow
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DB_URL: jdbc:mysql://db:3306/stageflow?allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # ---------- Sauvegardes (profil "sauvegarde") ----------
  # docker compose --profile sauvegarde up -d
  backup:
    profiles: ["sauvegarde"]
    image: mysql:8.4
    environment:
      MYSQL_HOST: db
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-demo}
      MYSQL_DATABASE: stageflow
      # une sauvegarde toutes les N secondes (86400 = 1 jour), on garde les N derniers jours
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/scripts/backup-loop.sh"]

  # ---------- Supervision (profil "supervision") ----------
  # docker compose --profile supervision up -d
  prometheus:
    profiles: ["supervision"]
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  grafana:
    profiles: ["supervision"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Mesure le trafic de nginx (nombre de requêtes, connexions)
  nginx-exporter:
    profiles: ["supervision"]
    image: nginx/nginx-prometheus-exporter:1.3.0
    command: ["--nginx.scrape-uri=http://frontend:8081/stub_status"]
    depends_on:
      - frontend

  # Mesure la base MySQL (connexions, requêtes par seconde)
  mysql-exporter:
    profiles: ["supervision"]
    image: prom/mysqld-exporter:v0.16.0
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=root
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-demo}
    depends_on:
      db:
        condition: service_healthy

  # Teste régulièrement que le site et l'API répondent
  blackbox:
    profiles: ["supervision"]
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

volumes:
  dbdata:
  prometheusdata:
  grafanadata:
