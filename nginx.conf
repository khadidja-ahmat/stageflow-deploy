server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... vont au backend (le nom "backend" est celui du service dans docker-compose.yml).
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Tout le reste est l'application React.
    location / {
        try_files $uri /index.html;
    }
}
